<!doctype html>
<!-- Closing card. assemble.py renders it to a 1600x900 still whenever edit.json names it as a clip.
     Make qr.svg with the snippet in SKILL.md, or delete the .qr element. -->
<html>
<head>
<meta charset="utf-8">
<title>End card</title>
<style>
  body { margin: 0; width: 1600px; height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: radial-gradient(circle at 30% 30%, #1f6fb8, #0d4d8c); color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 96px; margin: 0 0 12px; font-weight: 800; letter-spacing: -1px; }
  .tag { font-size: 30px; opacity: .9; margin-bottom: 56px; }
  .cta { font-size: 30px; opacity: .9; margin-bottom: 14px; }
  .link { display: flex; align-items: center; gap: 40px; }
  .url { font-size: 48px; font-weight: 700; background: #fff; color: #0d4d8c; padding: 14px 34px; border-radius: 14px; }
  .qr { background: #fff; padding: 14px; border-radius: 14px; }
  .qr img { display: block; width: 190px; height: 190px; }
  .by { position: absolute; bottom: 84px; font-size: 22px; opacity: .85; }
  .credit { position: absolute; bottom: 36px; font-size: 16px; opacity: .7; text-align: center; max-width: 1300px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Tool name</h1>
  <div class="tag">One line on what it is for</div>
  <div class="cta">Request an account at</div>
  <div class="link">
    <div class="url">example.org/tool</div>
    <div class="qr"><img src="qr.svg" alt="QR code for example.org/tool"></div>
  </div>
  <div class="by">Built by SIL Global's AI Engineering Team</div>
  <div class="credit">Text credits and licences for any Scripture shown on screen go here.</div>
</body>
</html>
